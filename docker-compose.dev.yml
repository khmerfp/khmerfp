# Development stack with hot reload.
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Client: http://localhost:5173   (Vite dev server, HMR)
# API:    http://localhost:3000   (node --watch)
# DB:     localhost:5432          (Postgres container)
#
# Source directories are bind-mounted; node_modules live in the image and are
# masked with anonymous volumes so Windows host modules never leak in.
name: khmerfp-be-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-khmerfp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-khmerfp}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      target: deps
    command: npm run dev --workspace server
    working_dir: /app
    restart: unless-stopped
    env_file:
      - path: server/.env
        required: false
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-khmerfp}
      APP_ORIGINS: http://localhost:5173
    volumes:
      - ./server:/app/server
      - /app/server/node_modules
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-3000}:3000"

  client:
    build:
      context: .
      target: deps
    command: npm run dev --workspace client -- --host 0.0.0.0 --port 5173
    working_dir: /app
    restart: unless-stopped
    environment:
      # Inside the client container, "localhost" is the container itself, so
      # point the Vite /api proxy at the server service.
      VITE_DEV_API_PROXY: http://server:3000
      # Make file watching reliable on Windows bind mounts.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./client:/app/client
      - /app/client/node_modules
      - /app/node_modules
    depends_on:
      - server
    ports:
      - "5173:5173"

volumes:
  pgdata-dev:
