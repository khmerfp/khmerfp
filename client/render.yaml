services:
  - type: web
    name: khmerfp-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_FACEBOOK_APP_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

