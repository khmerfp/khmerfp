services:
  - type: web
    name: angkor-payment-sandbox
    runtime: node
    rootDir: .
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYWAY_ENV
        value: production
      - key: PAYWAY_CHECKOUT_ENABLED
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: PAYWAY_PRODUCTION_MERCHANT_ID
        sync: false
      - key: PAYWAY_PRODUCTION_API_KEY
        sync: false
      - key: PAYWAY_PRODUCTION_CALLBACK_SECRET
        sync: false
      - key: PAYWAY_PRODUCTION_SUCCESS_URL
        sync: false
      - key: PAYWAY_PRODUCTION_CANCEL_URL
        sync: false
