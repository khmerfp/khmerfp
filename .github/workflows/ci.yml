name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Lint client
        run: npm run lint --workspace client

      - name: Test client
        run: npm test --workspace client

      - name: Build client
        run: npm run build --workspace client

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: angkor_payment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/angkor_payment_test
      TEST_DATABASE_DISPOSABLE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Lint server
        run: npm run lint --workspace server

      - name: Test server
        run: npm test --workspace server

      - name: Check server syntax
        run: npm run build --workspace server

      - name: Test and lint shared CTF identifiers
        run: |
          npm test --workspace @khmerfp/contracts
          npm run lint --workspace @khmerfp/contracts
