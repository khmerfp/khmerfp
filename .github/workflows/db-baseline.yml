name: db baseline

on:
  pull_request:
    paths:
      - "packages/db/**"
      - "docs/database/baseline-adoption.md"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  validate-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate baseline artifacts
        run: npm run db:validate-baseline --workspace @khmerfp/db

  test-baseline-migration:
    runs-on: ubuntu-latest
    container: node:22-bookworm-slim
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: khmerfp_test
          POSTGRES_PASSWORD: khmerfp_test_password
          POSTGRES_DB: khmerfp_migration_test
        options: >-
          --health-cmd "pg_isready -U khmerfp_test -d khmerfp_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      MIGRATION_TEST_CI_HOST: postgres
      MIGRATION_TEST_DATABASE_URL: postgresql://khmerfp_test:khmerfp_test_password@postgres:5432/khmerfp_migration_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test baseline migration
        run: npm run db --workspace @khmerfp/db
