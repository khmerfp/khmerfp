services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-khmerfp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-khmerfp}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    # Pulls OAuth / PayWay / Bakong secrets from server/.env when present.
    # Values under `environment` below take precedence over that file.
    env_file:
      - path: server/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Overrides the Neon DATABASE_URL from server/.env with the local db.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-khmerfp}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:8080,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
