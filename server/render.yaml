services:
  - type: web
    name: angkor-payment-api
    runtime: node
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    domains:
      - api.khmerfp.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYWAY_ENV
        value: sandbox
      - key: PAYWAY_CHECKOUT_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: APP_ORIGINS
        value: https://khmerfp.com,https://www.khmerfp.com,https://staff.khmerfp.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TG_CLIENT_ID
        sync: false
      - key: TG_CLIENT_SECRET
        sync: false
      - key: TG_REDIRECT_URI
        value: https://api.khmerfp.com/api/auth/telegram/callback
      - key: FRONTEND_URL
        value: https://khmerfp.com
      - key: MOCEAN_API_TOKEN
        sync: false
      - key: MOCEAN_FROM
        sync: false
      - key: PHONE_OTP_DEV_FALLBACK
        value: "false"
      - key: PAYWAY_SANDBOX_MERCHANT_ID
        sync: false
      - key: PAYWAY_SANDBOX_API_KEY
        sync: false
      - key: PAYWAY_SANDBOX_CALLBACK_SECRET
        sync: false
      - key: PAYWAY_SANDBOX_SUCCESS_URL
        sync: false
      - key: PAYWAY_SANDBOX_CANCEL_URL
        sync: false

